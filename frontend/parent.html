<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練琴獎勵系統 — 家長</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container container--stacked">
        <!-- 上方歡迎區 -->
        <div class="welcome-section">
            <img src="/icon.png" class="app-icon" alt="練琴獎勵系統">
            <h1>練琴<span>獎勵</span>系統</h1>
            <p>記錄每日練琴時間<br>交換遊戲時間獎勵</p>
        </div>

        <!-- 右側登入/儀表板 -->
        <div class="login-section">

            <!-- 登入表單 -->
            <div class="login-form" id="loginForm">
                <a href="/" class="back-link">← 返回首頁</a>
                <h2>👨‍👩‍👧 家長登入</h2>

                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <div class="form-group">
                    <label for="parentUsername">用戶名</label>
                    <input type="text" id="parentUsername" placeholder="輸入用戶名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="parentPassword">密碼</label>
                    <input type="password" id="parentPassword" placeholder="輸入密碼" autocomplete="current-password">
                </div>
                <div class="form-group remember-row">
                    <label class="remember-label">
                        <input type="checkbox" id="parentRemember"> 記住帳號
                    </label>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在登入...</p>
                </div>

                <button class="login-btn" onclick="handleLogin()" id="loginBtn">登入</button>
            </div>

            <!-- 儀表板 -->
            <div class="dashboard" id="dashboard">
                <div class="dashboard-header">
                    <h2 id="dashboardTitle">歡迎！</h2>
                    <p id="dashboardSubtitle">👨‍👩‍👧 家長</p>
                </div>

                <div class="user-info">
                    <div class="info-item">
                        <span class="info-label">用戶名</span>
                        <span class="info-value" id="userName"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">家長 ID</span>
                        <span class="info-value" id="userId"></span>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn logout" onclick="handleLogout()">登出</button>
                </div>

                <!-- 家長導航 -->
                <div id="parentNav">
                    <div class="nav-tabs">
                        <button class="nav-tab active" onclick="switchTab('children-list')">👧 我的孩子</button>
                        <button class="nav-tab" onclick="switchTab('pending-records')">⏳ 待批準記錄</button>
                        <button class="nav-tab" onclick="switchTab('approved-records')">✅ 已批准紀錄</button>
                        <button class="nav-tab" onclick="switchTab('manage-children')">👤 管理兒童帳號</button>
                        <button class="nav-tab" onclick="switchTab('special-redemptions-mgmt')">🎁 特殊兌換</button>
                        <button class="nav-tab" onclick="switchTab('lottery-mgmt')">🎰 設定抽獎</button>
                        <button class="nav-tab" onclick="switchTab('ichiban-mgmt')">🎏 設定一番賞</button>
                        <button class="nav-tab" onclick="switchTab('parent-settings')">⚙️ 帳號設定</button>
                    </div>

                    <!-- 孩子列表 -->
                    <div id="children-list" class="tab-content active">
                        <div class="form-section">
                            <h3>👧 我的孩子</h3>
                            <div id="childrenListContainer" style="margin-top: 20px;"></div>
                        </div>
                        <div id="childPracticeDetail" style="display: none; margin-top: 16px;"></div>
                    </div>

                    <!-- 待批準記錄 -->
                    <div id="pending-records" class="tab-content">
                        <div class="form-section">
                            <h3>⏳ 待批準的練琴記錄</h3>
                            <div id="pendingRecordsContainer" style="margin-top: 20px;"></div>
                        </div>
                    </div>

                    <!-- 已批准紀錄 -->
                    <div id="approved-records" class="tab-content">
                        <div class="form-section">
                            <h3>✅ 過去 30 天已批准紀錄</h3>
                            <div id="approvedRecordsContainer" style="margin-top: 16px;"></div>
                        </div>
                    </div>

                    <!-- 管理兒童帳號 -->
                    <div id="manage-children" class="tab-content">
                        <div class="form-section">
                            <h3>➕ 新增兒童帳號</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="newChildId">帳號 ID（選填，留空自動分配）</label>
                                    <input type="text" id="newChildId" placeholder="英文或數字，例如：kid01、101" autocapitalize="none" autocorrect="off" autocomplete="off">
                                </div>
                                <div class="form-group">
                                    <label for="newChildAge">年齡（選填）</label>
                                    <input type="number" id="newChildAge" placeholder="輸入年齡" min="1" max="18">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="newChildName">姓名</label>
                                    <input type="text" id="newChildName" placeholder="輸入孩子姓名">
                                </div>
                                <div class="form-group">
                                    <label for="newChildPassword">密碼</label>
                                    <input type="password" id="newChildPassword" placeholder="設定登入密碼">
                                </div>
                            </div>
                            <button class="submit-btn" onclick="addChildAccount()">新增帳號</button>
                            <div id="addChildResult" style="margin-top: 15px;"></div>
                        </div>
                        <div class="form-section">
                            <h3>👧 現有兒童帳號</h3>
                            <div id="manageChildrenList" style="margin-top: 15px;"></div>
                        </div>
                    </div>

                    <!-- 特殊兌換管理 -->
                    <div id="special-redemptions-mgmt" class="tab-content">
                        <div class="form-section">
                            <h3>➕ 新增特殊兌換項目</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="srChildSelect">選擇孩子</label>
                                    <select id="srChildSelect"></select>
                                </div>
                                <div class="form-group">
                                    <label for="srPointsCost">兌換點數</label>
                                    <input type="number" id="srPointsCost" placeholder="例: 100" min="1">
                                </div>
                            </div>
                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="srContent">兌換內容</label>
                                    <input type="text" id="srContent" placeholder="例: 一次冰淇淋、看一部電影">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="srQuantity">數量（選填，留空表示無限）</label>
                                    <input type="number" id="srQuantity" placeholder="例: 3" min="1">
                                </div>
                                <div class="form-group">
                                    <label for="srExpiresAt">兌換期限（選填，留空表示不過期）</label>
                                    <input type="datetime-local" id="srExpiresAt">
                                </div>
                            </div>
                            <button class="submit-btn" onclick="addSpecialRedemption()">新增項目</button>
                            <div id="srAddResult" style="margin-top: 15px;"></div>
                        </div>
                        <div class="form-section">
                            <h3>📋 目前特殊兌換項目</h3>
                            <div id="srManageList" style="margin-top: 15px;"></div>
                        </div>
                    </div>

                    <!-- 抽獎管理 -->
                    <div id="lottery-mgmt" class="tab-content">
                        <div id="lotteryChildSections" style="display:flex;flex-direction:column;gap:20px;">
                            <div style="text-align:center;color:var(--text-subdued);padding:20px;">載入中...</div>
                        </div>
                    </div>

                    <!-- 一番賞管理 -->
                    <div id="ichiban-mgmt" class="tab-content">
                        <div id="ichibanChildSections" style="display:flex;flex-direction:column;gap:20px;">
                            <div style="text-align:center;color:var(--text-subdued);padding:20px;">載入中...</div>
                        </div>
                    </div>

                    <!-- 帳號設定 -->
                    <div id="parent-settings" class="tab-content">
                        <div class="form-section">
                            <h3>🔑 修改登入密碼</h3>
                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="currentPassword">目前密碼</label>
                                    <input type="password" id="currentPassword" placeholder="輸入目前密碼">
                                </div>
                            </div>
                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="newPassword">新密碼</label>
                                    <input type="password" id="newPassword" placeholder="輸入新密碼（至少4個字元）">
                                </div>
                            </div>
                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="confirmPassword">確認新密碼</label>
                                    <input type="password" id="confirmPassword" placeholder="再次輸入新密碼">
                                </div>
                            </div>
                            <button class="submit-btn" onclick="changeParentPassword()">更新密碼</button>
                            <div id="changePasswordResult" style="margin-top: 15px;"></div>
                        </div>
                    </div>

                </div><!-- /parentNav -->
            </div><!-- /dashboard -->

        </div><!-- /login-section -->
    </div><!-- /container -->

    <script>
        const API_BASE_URL = `${window.location.origin}/api`;
        let currentToken = null;
        let currentUserId = null;

        // ── 通用工具 ──────────────────────────────────────────────

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function clearMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function formatDatetime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            const y = d.getFullYear();
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const mi = String(d.getMinutes()).padStart(2, '0');
            return `${y}/${mo}/${day} ${h}:${mi}`;
        }

        // ── 記住帳號 ──────────────────────────────────────────────

        function loadRememberedCredentials() {
            const saved = JSON.parse(localStorage.getItem('parent_remember') || 'null');
            if (saved) {
                document.getElementById('parentUsername').value = saved.username || '';
                document.getElementById('parentRemember').checked = true;
            }
        }
        loadRememberedCredentials();

        // ── 保留登入狀態 (60 分鐘) ────────────────────────────────

        const SESSION_KEY = 'parent_session';
        const SESSION_TTL = 60 * 60 * 1000; // 60 minutes in ms

        function saveSession(token, parentId, username) {
            localStorage.setItem(SESSION_KEY, JSON.stringify({
                token, parentId, username, savedAt: Date.now()
            }));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        function tryRestoreSession() {
            const raw = localStorage.getItem(SESSION_KEY);
            if (!raw) return;
            const s = JSON.parse(raw);
            if (!s.token || Date.now() - s.savedAt > SESSION_TTL) {
                clearSession();
                return;
            }
            currentToken = s.token;
            currentUserId = s.parentId;
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('dashboardTitle').textContent = `歡迎，${s.username}！`;
            document.getElementById('userName').textContent = s.username;
            document.getElementById('userId').textContent = s.parentId;
            loadParentDashboard(currentUserId);
        }
        tryRestoreSession();

        // ── 登入 ──────────────────────────────────────────────────

        async function handleLogin() {
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            loginBtn.disabled = true;
            loading.style.display = 'block';
            clearMessages();

            try {
                const username = document.getElementById('parentUsername').value;
                const password = document.getElementById('parentPassword').value;
                if (!username || !password) throw new Error('請輸入用戶名和密碼');

                if (document.getElementById('parentRemember').checked) {
                    localStorage.setItem('parent_remember', JSON.stringify({ username }));
                } else {
                    localStorage.removeItem('parent_remember');
                }

                const response = await fetch(`${API_BASE_URL}/auth/parent/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || '登入失敗');
                }

                const data = await response.json();
                currentToken = data.access_token;
                currentUserId = data.parent_id;
                saveSession(data.access_token, data.parent_id, data.username);

                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('dashboard').classList.add('active');
                document.getElementById('dashboardTitle').textContent = `歡迎，${data.username}！`;
                document.getElementById('userName').textContent = data.username;
                document.getElementById('userId').textContent = data.parent_id;

                loadParentDashboard(currentUserId);
                showSuccess('登入成功！');

            } catch (error) {
                showError('登入失敗: ' + error.message);
            } finally {
                loginBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Enter 鍵觸發登入
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.getElementById('loginForm').offsetParent !== null) handleLogin();
        });

        // ── 登出 ──────────────────────────────────────────────────

        function handleLogout() {
            currentToken = null;
            currentUserId = null;
            clearSession();
            window.location.href = '/';
        }

        // ── Tab 切換 ──────────────────────────────────────────────

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'approved-records') loadApprovedRecords();
            else if (tabName === 'manage-children') loadManageChildren();
            else if (tabName === 'special-redemptions-mgmt') loadSpecialRedemptionsMgmt();
            else if (tabName === 'lottery-mgmt') loadLotteryMgmt();
            else if (tabName === 'ichiban-mgmt') loadIchibanMgmt();
        }

        // ── 家長儀表板 ────────────────────────────────────────────

        async function loadParentDashboard(parentId) {
            try {
                const response = await fetch(`${API_BASE_URL}/practice/parent/children`, {
                    headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error('無法獲取孩子列表');
                const data = await response.json();
                displayChildrenList(data.children);
                loadPendingRecords();
            } catch (error) {
                showError('加載家長儀表板失敗: ' + error.message);
            }
        }

        function displayChildrenList(children) {
            const container = document.getElementById('childrenListContainer');
            if (children.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">暫無孩子信息</p>';
                return;
            }
            container.innerHTML = children.map(child => `
                <div class="child-card" onclick="selectChildForParent('${child.id}', '${child.name}')">
                    <div class="child-card-header">
                        <div>
                            <div class="child-name">👧 ${child.name}</div>
                            <div class="child-age">年齡: ${child.age || '未設置'}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 18px; font-weight: 600; color: #667eea;">${child.game_balance} 點</div>
                            <div style="font-size: 12px; color: #999;">獎勵點數</div>
                            <div style="font-size: 16px; font-weight: 600; color: #e67e22; margin-top: 6px;">🎟️ ${child.lottery_tickets || 0} 張</div>
                            <div style="font-size: 12px; color: #999;">抽獎卷</div>
                        </div>
                    </div>
                    <div class="child-stats">
                        <div class="child-stat-item">
                            <div class="child-stat-value">${child.pending_records}</div>
                            <div class="child-stat-label">待批準</div>
                        </div>
                        <div class="child-stat-item">
                            <div class="child-stat-value">${child.total_practice_minutes_past_30_days}</div>
                            <div class="child-stat-label">30天練琴(分)</div>
                        </div>
                        <div class="child-stat-item">
                            <div class="child-stat-value">${child.practice_records_count}</div>
                            <div class="child-stat-label">總記錄</div>
                        </div>
                    </div>
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="submit-btn" style="flex: 1;" onclick="event.stopPropagation(); selectChildForParent('${child.id}', '${child.name}')">
                            📋 練琴紀錄
                        </button>
                        <button class="submit-btn" style="flex: 1; background: #28a745;" onclick="event.stopPropagation(); showRewardDialog('${child.id}', '${child.name}')">
                            🎁 獎勵點數
                        </button>
                        <button class="submit-btn" style="flex: 1; background: #e67e22;" onclick="event.stopPropagation(); showLotteryDialog('${child.id}', '${child.name}')">
                            🎟️ 抽獎卷
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ── 孩子練琴紀錄面板 ──────────────────────────────────────

        let currentChildPracticeId = null;
        let currentChildPracticeName = null;

        function selectChildForParent(childId, childName) {
            currentChildPracticeId = childId;
            currentChildPracticeName = childName;
            loadChildPracticeRecords(childId, childName, '');
            setTimeout(() => {
                const detail = document.getElementById('childPracticeDetail');
                if (detail) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        async function loadChildPracticeRecords(childId, childName, statusFilter) {
            const detail = document.getElementById('childPracticeDetail');
            detail.style.display = 'block';
            detail.innerHTML = `<div class="form-section"><p style="text-align:center;color:#999;">載入中...</p></div>`;

            try {
                let url = `${API_BASE_URL}/practice/records/${childId}`;
                if (statusFilter) url += `?status=${statusFilter}`;
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                if (!response.ok) throw new Error('無法獲取練琴記錄');
                const data = await response.json();

                const filters = [
                    { value: '', label: '全部' },
                    { value: 'pending', label: '待批準' },
                    { value: 'approved', label: '已批准' },
                    { value: 'rejected', label: '已拒絕' },
                ];
                const filterHtml = filters.map(f => `
                    <button onclick="loadChildPracticeRecords('${childId}', '${childName}', '${f.value}')"
                        style="padding:5px 14px;border-radius:20px;border:1px solid #667eea;cursor:pointer;font-size:13px;
                               background:${f.value === statusFilter ? '#667eea' : 'white'};
                               color:${f.value === statusFilter ? 'white' : '#667eea'};">
                        ${f.label}
                    </button>`).join('');

                const statusLabel = { pending: '待批準', approved: '已批准', rejected: '已拒絕' };
                const statusClass = { pending: 'pending', approved: 'approved', rejected: 'rejected' };

                const recordsHtml = data.records.length === 0
                    ? '<p style="text-align:center;color:#999;padding:20px;">暫無符合的記錄</p>'
                    : data.records.map(r => `
                        <div class="record-item">
                            <div class="record-header">
                                <div>
                                    <div class="record-date">${r.date}</div>
                                    <div style="font-size:13px;color:#999;margin-top:3px;">
                                        時間: ${r.time ? r.time.substring(0, 5) : '未設置'} | 練琴: ${r.practice_minutes} 分鐘
                                    </div>
                                </div>
                                <div class="record-status ${statusClass[r.status] || r.status}">
                                    ${statusLabel[r.status] || r.status}
                                </div>
                            </div>
                            ${r.notes ? `<div class="record-details">備註: ${r.notes}</div>` : ''}
                            ${r.status === 'pending' ? `
                            <div class="record-action-buttons">
                                <button class="record-action-btn approve" onclick="approveRecord(${r.id})">✓ 批準</button>
                                <button class="record-action-btn reject" onclick="rejectRecord(${r.id})">✗ 拒絕</button>
                            </div>` : ''}
                        </div>`).join('');

                detail.innerHTML = `
                    <div class="form-section">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                            <h3 style="margin:0;">📋 ${childName} 的練琴紀錄</h3>
                            <button onclick="closeChildPracticeDetail()"
                                style="background:none;border:none;font-size:22px;cursor:pointer;color:#999;line-height:1;">✕</button>
                        </div>
                        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
                            <div style="background:#f0f4ff;border-radius:8px;padding:10px 18px;text-align:center;">
                                <div style="font-size:20px;font-weight:600;color:#667eea;">${data.total_records}</div>
                                <div style="font-size:12px;color:#999;">總記錄</div>
                            </div>
                            <div style="background:#fff3cd;border-radius:8px;padding:10px 18px;text-align:center;">
                                <div style="font-size:20px;font-weight:600;color:#e0a800;">${data.pending_records}</div>
                                <div style="font-size:12px;color:#999;">待批準</div>
                            </div>
                            <div style="background:#d4edda;border-radius:8px;padding:10px 18px;text-align:center;">
                                <div style="font-size:20px;font-weight:600;color:#28a745;">${data.approved_records}</div>
                                <div style="font-size:12px;color:#999;">已批准</div>
                            </div>
                            <div style="background:#e8f4f8;border-radius:8px;padding:10px 18px;text-align:center;">
                                <div style="font-size:20px;font-weight:600;color:#17a2b8;">${data.total_approved_minutes}</div>
                                <div style="font-size:12px;color:#999;">總練琴(分)</div>
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">${filterHtml}</div>

        // ── 待批準記錄 ────────────────────────────────────────────

        async function loadPendingRecords() {
            try {
                const response = await fetch(`${API_BASE_URL}/practice/parent/children`, {
                    headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error('無法獲取待批準的記錄');
                const parentData = await response.json();
                let allPendingRecords = [];
                for (const child of parentData.children) {
                    const recordResponse = await fetch(`${API_BASE_URL}/practice/records/${child.id}?status=pending`, {
                        headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' }
                    });
                    if (recordResponse.ok) {
                        const recordData = await recordResponse.json();
                        recordData.records.forEach(record => { record.child_name = child.name; });
                        allPendingRecords = allPendingRecords.concat(recordData.records);
                    }
                }
                displayPendingRecords(allPendingRecords);
            } catch (error) {
                showError('加載待批準記錄失敗: ' + error.message);
            }
        }

        function displayPendingRecords(records) {
            const container = document.getElementById('pendingRecordsContainer');
            if (records.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">暫無待批準的記錄</p>';
                return;
            }
            container.innerHTML = records.map(record => `
                <div class="record-item">
                    <div class="record-header">
                        <div>
                            <div class="record-date">👧 ${record.child_name} - ${record.date}</div>
                            <div style="font-size: 13px; color: #999; margin-top: 3px;">
                                時間: ${record.time ? record.time.substring(0, 5) : '未設置'} | 練琴: ${record.practice_minutes} 分鐘
                            </div>
                        </div>
                        <div class="record-status pending">待批準</div>
                    </div>
                    <div class="record-details">
                        <div>備註: ${record.notes || '無'}</div>
                        <div>提交時間: ${record.created_at ? formatDatetime(record.created_at) : '未知'}</div>
                    </div>
                    <div class="record-action-buttons">
                        <button class="record-action-btn approve" onclick="approveRecord(${record.id})">✓ 批準</button>
                        <button class="record-action-btn reject" onclick="rejectRecord(${record.id})">✗ 拒絕</button>
                    </div>
                </div>
            `).join('');
        }

        // ── 已批准紀錄 ────────────────────────────────────────────

        async function loadApprovedRecords() {
            const container = document.getElementById('approvedRecordsContainer');
            container.innerHTML = '<p style="text-align:center;color:var(--text-subdued);">載入中...</p>';
            try {
                const parentResp = await fetch(`${API_BASE_URL}/practice/parent/children`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if (!parentResp.ok) throw new Error('無法取得兒童列表');
                const parentData = await parentResp.json();

                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                const startDate = thirtyDaysAgo.toISOString().split('T')[0];

                const childGroups = [];
                for (const child of parentData.children) {
                    const resp = await fetch(
                        `${API_BASE_URL}/practice/records/${child.id}?status=approved&start_date=${startDate}`,
                        { headers: { 'Authorization': `Bearer ${currentToken}` } }
                    );
                    if (!resp.ok) continue;
                    const data = await resp.json();
                    if (data.records.length > 0) childGroups.push({ child, records: data.records });
                }

                if (childGroups.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:var(--text-subdued);padding:20px;">過去 30 天內沒有已批准的練琴紀錄</p>';
                    return;
                }

                container.innerHTML = childGroups.map(({ child, records }) => {
                    const totalMinutes = records.reduce((sum, r) => sum + r.practice_minutes, 0);
                    const recordRows = records.map(r => `
                        <div class="approved-record-row">
                            <span class="ar-date">${r.date}</span>
                            <span class="ar-minutes">${r.practice_minutes} 分鐘</span>
                            <span class="ar-note">${r.notes || ''}</span>
                            <span class="ar-time">${r.approved_at ? formatDatetime(r.approved_at) : ''}</span>
                        </div>
                    `).join('');
                    return `
                        <div class="approved-child-group">
                            <div class="approved-child-header">
                                <span class="approved-child-name">👧 ${child.name}</span>
                                <span class="approved-child-total">共 ${totalMinutes} 分鐘 · ${records.length} 筆</span>
                            </div>
                            <div class="approved-record-table">
                                <div class="approved-record-row header">
                                    <span class="ar-date">日期</span>
                                    <span class="ar-minutes">練琴時間</span>
                                    <span class="ar-note">備註</span>
                                    <span class="ar-time">批准日期</span>
                                </div>
                                ${recordRows}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                container.innerHTML = `<p style="color:var(--danger)">載入失敗：${error.message}</p>`;
            }
        }

        function showRewardDialog(childId, childName) {
            const minutes = prompt(`請輸入要獎勵給 ${childName} 的練琴獎勵點數:\n(必須是5的倍數)\n\n例如: 5, 10, 15, 30`);
            if (!minutes || isNaN(minutes)) return;
            const numMinutes = parseInt(minutes);
            if (numMinutes <= 0) { showError('獎勵點數必須大於0'); return; }
            if (numMinutes % 5 !== 0) { showError('獎勵點數必須是5的倍數'); return; }
            const reason = prompt(`請輸入獎勵原因(可選):\n例如: 表現良好、完成額外任務等`);
            rewardGameTime(childId, childName, numMinutes, reason || '家長獎勵');

            try {
                const response = await fetch(`${API_BASE_URL}/awards/give`, {

                showError('ID 只能包含英文字母與數字，長度 1~20'); return;

            try {

                await Promise.all(_lotteryChildren.map(c => refreshChildLotterySection(c)));
            } catch (e) {
                container.innerHTML = '<div style="text-align:center;color:var(--danger);padding:20px;">載入失敗</div>';
            }
        }

        async function refreshChildLotterySection(child) {
            const contentEl = document.getElementById(`lottery-content-${child.id}`);
            if (!contentEl) return;
            try {
                const res = await fetch(`${API_BASE_URL}/lottery/active?child_id=${child.id}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.active && data.round) {
                    const rnd = data.round;
                    const prizesHtml = rnd.prizes.map(p =>
                        `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;">
                            <span>${p.is_jackpot ? '🏆 ' : ''}${p.name}</span>
                            <span style="color:#667eea;font-weight:600;">${p.probability}%</span>
                        </div>`
                    ).join('');
                    contentEl.innerHTML = `
                        <div class="record-item">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
                                <div>
                                    <div style="margin-top:4px;">已抽次數：${rnd.draws_used} 次
                                        <span style="color:var(--text-subdued);font-size:13px;">還差 ${rnd.draws_until_pity} 抽必中大獎（保底 ${rnd.pity_limit} 次）</span>
                                    </div>
                                </div>
                                <button class="action-btn" style="padding:6px 14px;" onclick="endLotteryRound(${rnd.id}, '${child.id}')">結束本輪</button>
                            </div>
                            <div style="margin-top:10px;">${prizesHtml}</div>
                        </div>`;
                } else {
                    const cid = child.id;
                    contentEl.innerHTML = `
                        <div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>保底次數（幾抽內一定中大獎）</label>
                                    <input type="number" id="lotteryPity-${cid}" value="10" min="1">
                                </div>
                            </div>
                            <div style="margin-top:12px;">
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                                    <label style="font-weight:600;">獎品設定（機率總和必須 = 100）</label>
                                    <span id="lotteryProbTotal-${cid}" style="font-size:13px;font-weight:600;color:var(--danger);">總和: 0</span>
                                </div>
                                <div id="lotteryPrizeRows-${cid}"></div>
                                <button type="button" class="action-btn" style="margin-top:8px;padding:6px 14px;font-size:13px;" onclick="addPrizeRow('${cid}')">+ 新增獎品</button>
                            </div>
                            <button class="submit-btn" style="margin-top:15px;" onclick="createLotteryRound('${cid}')">建立抽獎輪次</button>
                            <div id="lotteryCreateResult-${cid}" style="margin-top:12px;"></div>
                        </div>`;
                    addPrizeRow(cid, true);
                    addPrizeRow(cid, false);
                }
            } catch (e) {
                contentEl.innerHTML = '<div style="color:var(--danger);font-size:13px;">載入失敗</div>';
            }
        }

        function addPrizeRow(childId, isJackpot = false) {
            const container = document.getElementById(`lotteryPrizeRows-${childId}`);
            if (!container) return;
            const row = document.createElement('div');
            row.className = 'form-row';
            row.style.cssText = 'align-items:flex-end;margin-bottom:6px;';
            row.innerHTML = `
                <div class="form-group" style="flex:2;">
                    <label>獎品名稱</label>
                    <input type="text" class="prize-name" placeholder="${isJackpot ? '大獎（例: 玩具車）' : '普通獎（例: 貼紙）'}">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>機率 (%)</label>
                    <input type="number" class="prize-prob" min="1" max="99" value="${isJackpot ? '5' : '50'}" oninput="updateProbTotal('${childId}')">
                </div>
                <div class="form-group" style="flex:0 0 auto;">
                    <label>大獎</label>
                    <input type="checkbox" class="prize-jackpot" style="width:20px;height:20px;margin-top:10px;" ${isJackpot ? 'checked' : ''}>
                </div>
                <div style="flex:0 0 auto;padding-bottom:6px;">
                    <button type="button" class="action-btn" style="padding:6px 10px;font-size:13px;background:var(--danger);" onclick="removePrizeRow(this, '${childId}')">✕</button>
                </div>`;
            container.appendChild(row);
            updateProbTotal(childId);
        }

        function removePrizeRow(btn, childId) {
            btn.closest('.form-row').remove();
            updateProbTotal(childId);
        }

        function updateProbTotal(childId) {
            const container = document.getElementById(`lotteryPrizeRows-${childId}`);
            if (!container) return;
            const probs = [...container.querySelectorAll('.prize-prob')].map(i => parseInt(i.value) || 0);
            const total = probs.reduce((a, b) => a + b, 0);
            const el = document.getElementById(`lotteryProbTotal-${childId}`);
            if (!el) return;
            el.textContent = `總和: ${total}`;
            el.style.color = total === 100 ? 'var(--success)' : 'var(--danger)';
        }

        async function createLotteryRound(childId) {
            const pityEl = document.getElementById(`lotteryPity-${childId}`);
            const pityLimit = parseInt(pityEl ? pityEl.value : '');
            const resultEl = document.getElementById(`lotteryCreateResult-${childId}`);
            const prizeContainer = document.getElementById(`lotteryPrizeRows-${childId}`);

            const prizes = [...prizeContainer.querySelectorAll('.form-row')].map(row => ({
                name: row.querySelector('.prize-name').value.trim(),
                probability: parseInt(row.querySelector('.prize-prob').value) || 0,
                is_jackpot: row.querySelector('.prize-jackpot').checked,
            }));

            if (!pityLimit || pityLimit < 1) { resultEl.innerHTML = '<p style="color:var(--danger)">保底次數至少為 1</p>'; return; }
            if (prizes.some(p => !p.name)) { resultEl.innerHTML = '<p style="color:var(--danger)">請填寫所有獎品名稱</p>'; return; }

            const child = _lotteryChildren.find(c => c.id === childId);
            const childName = child ? child.name : childId;
            try {
                const res = await fetch(`${API_BASE_URL}/lottery/rounds`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ child_id: childId, pity_limit: pityLimit, prizes })
                });
                const data = await res.json();
                if (!res.ok) {
                    resultEl.innerHTML = `<p style="color:var(--danger)">❌ 建立失敗：${data.error}</p>`;
                    return;
                }
                if (child) await refreshChildLotterySection(child);
            } catch (e) {
                resultEl.innerHTML = `<p style="color:var(--danger)">❌ 建立失敗：${e.message}</p>`;
            }
        }

        async function endLotteryRound(roundId, childId) {
            if (!confirm('確定要結束這個抽獎輪次？')) return;
            try {
                const res = await fetch(`${API_BASE_URL}/lottery/rounds/${roundId}/finish`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if (!res.ok) throw new Error('結束失敗');
                const child = _lotteryChildren.find(c => c.id === childId);
                if (child) await refreshChildLotterySection(child);
            } catch (e) {
                alert('結束失敗：' + e.message);
            }
        }

        // ── 一番賞管理（家長） ────────────────────────────────────
        // 與抽獎的差別：獎項數量固定、依序命名 A賞/B賞/…、無大獎與保底、抽完才能開下一輪。

        let _ichibanChildren = [];

        const GRADE_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        async function loadIchibanMgmt() {
            const container = document.getElementById('ichibanChildSections');
            try {
                const res = await fetch(`${API_BASE_URL}/practice/parent/children`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                _ichibanChildren = data.children || [];
                if (_ichibanChildren.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:var(--text-subdued);padding:20px;">尚無孩子帳號</div>';
                    return;
                }
                container.innerHTML = _ichibanChildren.map(c => `
                    <div class="form-section" id="ichiban-child-${c.id}">
                        <h3>👧 ${c.name}（${c.id}）</h3>
                        <div id="ichiban-content-${c.id}" style="margin-top:12px;">
                            <div style="color:var(--text-subdued);font-size:13px;">載入中...</div>
                        </div>
                    </div>`).join('');
                await Promise.all(_ichibanChildren.map(c => refreshChildIchibanSection(c)));
            } catch (e) {
                container.innerHTML = '<div style="text-align:center;color:var(--danger);padding:20px;">載入失敗</div>';
            }
        }

        async function refreshChildIchibanSection(child) {
            const contentEl = document.getElementById(`ichiban-content-${child.id}`);
            if (!contentEl) return;
            try {
                const res = await fetch(`${API_BASE_URL}/ichiban/active?child_id=${child.id}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.active && data.round) {
                    contentEl.innerHTML = renderIchibanActive(data.round, child.id);
                } else {
                    const cid = child.id;
                    contentEl.innerHTML = `
                        <p style="font-size:12px;color:var(--text-subdued);margin-bottom:14px;line-height:1.6;">
                            由上而下依序為 A賞、B賞、C賞…，可自由調整每個賞的數量。<br>
                            建立後孩子每抽一次就少一個獎項，全部抽完才能開下一箱。
                        </p>
                        <div class="ichiban-grid-head">
                            <div>賞別</div><div>獎項內容</div><div style="text-align:center;">數量</div><div></div>
                        </div>
                        <div id="ichibanPrizeRows-${cid}"></div>
                        <button type="button" class="action-btn" style="margin-top:4px;padding:7px 16px;font-size:12px;" onclick="addIchibanPrizeRow('${cid}')">＋ 新增獎項</button>
                        <div class="ichiban-editor-foot">
                            <div class="ichiban-total">總抽數<strong id="ichibanTotal-${cid}">0</strong></div>
                            <button class="submit-btn" style="margin:0;" onclick="createIchibanRound('${cid}')">🎏 建立一番賞</button>
                        </div>
                        <div id="ichibanCreateResult-${cid}" style="margin-top:12px;"></div>`;
                    addIchibanPrizeRow(cid, 1);
                    addIchibanPrizeRow(cid, 2);
                    addIchibanPrizeRow(cid, 3);
                }
            } catch (e) {
                contentEl.innerHTML = '<div style="color:var(--danger);font-size:13px;">載入失敗</div>';
            }
        }

        function renderIchibanActive(rnd, childId) {
            const pct = rnd.total_draws ? Math.round((rnd.draws_used / rnd.total_draws) * 100) : 0;
            return `
                <div class="ichiban-stats">
                    <div class="child-stat-item">
                        <div class="child-stat-value">${rnd.total_draws}</div>
                        <div class="child-stat-label">總抽數</div>
                    </div>
                    <div class="child-stat-item">
                        <div class="child-stat-value">${rnd.draws_used}</div>
                        <div class="child-stat-label">已抽出</div>
                    </div>
                    <div class="child-stat-item">
                        <div class="child-stat-value">${rnd.remaining_draws}</div>
                        <div class="child-stat-label">剩餘</div>
                    </div>
                </div>
                <div class="ichiban-progress"><span style="width:${pct}%;"></span></div>
                ${renderIchibanPrizeList(rnd.prizes)}
                <div class="ichiban-editor-foot">
                    <div class="ichiban-total" style="font-weight:600;">抽完才能開下一箱</div>
                    <button class="action-btn" style="width:auto;padding:9px 18px;font-size:12px;" onclick="endIchibanRound(${rnd.id}, '${childId}')">強制結束本箱</button>
                </div>`;
        }

        function renderIchibanPrizeList(prizes) {
            return prizes.map(p => {
                const soldOut = p.remaining_quantity === 0;
                return `
                    <div class="ichiban-prize${soldOut ? ' is-out' : ''}">
                        <div class="ichiban-grade">${p.grade}賞</div>
                        <div class="ichiban-prize-name">${p.name}</div>
                        <div class="ichiban-prize-count">${soldOut ? '已抽完' : `剩 ${p.remaining_quantity} / ${p.total_quantity}`}</div>
                    </div>`;
            }).join('');
        }

        function addIchibanPrizeRow(childId, defaultQty = 1) {
            const container = document.getElementById(`ichibanPrizeRows-${childId}`);
            if (!container) return;
            if (container.querySelectorAll('.ichiban-row').length >= GRADE_LETTERS.length) {
                alert(`最多只能設定 ${GRADE_LETTERS.length} 個獎項（A賞～Z賞）`);
                return;
            }
            const row = document.createElement('div');
            row.className = 'ichiban-row';
            row.innerHTML = `
                <div class="ichiban-grade prize-grade-label">—</div>
                <input type="text" class="ichiban-prize-name" placeholder="例: 去遊樂園">
                <input type="number" class="ichiban-prize-qty" min="1" value="${defaultQty}" oninput="updateIchibanTotal('${childId}')">
                <button type="button" class="ichiban-row-remove" title="刪除這個獎項" onclick="removeIchibanPrizeRow(this, '${childId}')">✕</button>`;
            container.appendChild(row);
            updateIchibanTotal(childId);
        }

        function removeIchibanPrizeRow(btn, childId) {
            btn.closest('.ichiban-row').remove();
            updateIchibanTotal(childId);
        }

        function updateIchibanTotal(childId) {
            const container = document.getElementById(`ichibanPrizeRows-${childId}`);
            if (!container) return;
            const rows = [...container.querySelectorAll('.ichiban-row')];
            // Grades follow row order, so relabel every row whenever one is added or removed.
            rows.forEach((row, i) => {
                row.querySelector('.prize-grade-label').textContent = `${GRADE_LETTERS[i]}賞`;
            });
            const total = rows.reduce(
                (sum, row) => sum + (parseInt(row.querySelector('.ichiban-prize-qty').value) || 0), 0);
            const el = document.getElementById(`ichibanTotal-${childId}`);
            if (el) el.textContent = total;
        }

        async function createIchibanRound(childId) {
            const resultEl = document.getElementById(`ichibanCreateResult-${childId}`);
            const container = document.getElementById(`ichibanPrizeRows-${childId}`);

            const prizes = [...container.querySelectorAll('.ichiban-row')].map(row => ({
                name: row.querySelector('.ichiban-prize-name').value.trim(),
                quantity: parseInt(row.querySelector('.ichiban-prize-qty').value) || 0,
            }));

            if (prizes.length === 0) { resultEl.innerHTML = '<p style="color:var(--danger)">請至少新增一個獎項</p>'; return; }
            if (prizes.some(p => !p.name)) { resultEl.innerHTML = '<p style="color:var(--danger)">請填寫所有獎項內容</p>'; return; }
            if (prizes.some(p => p.quantity < 1)) { resultEl.innerHTML = '<p style="color:var(--danger)">每個獎項數量至少為 1</p>'; return; }

            const child = _ichibanChildren.find(c => c.id === childId);
            try {
                const res = await fetch(`${API_BASE_URL}/ichiban/rounds`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ child_id: childId, prizes })
                });
                const data = await res.json();
                if (!res.ok) {
                    resultEl.innerHTML = `<p style="color:var(--danger)">❌ 建立失敗：${data.error}</p>`;
                    return;
                }
                if (child) await refreshChildIchibanSection(child);
            } catch (e) {
                resultEl.innerHTML = `<p style="color:var(--danger)">❌ 建立失敗：${e.message}</p>`;
            }
        }

        async function endIchibanRound(roundId, childId) {
            if (!confirm('確定要強制結束這個一番賞？尚未抽出的獎項將會作廢。')) return;
            try {
                const res = await fetch(`${API_BASE_URL}/ichiban/rounds/${roundId}/finish`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if (!res.ok) throw new Error('結束失敗');
                const child = _ichibanChildren.find(c => c.id === childId);
                if (child) await refreshChildIchibanSection(child);
            } catch (e) {
                alert('結束失敗：' + e.message);
            }
        }
    </script>
</body>
</html>
