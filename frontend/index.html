<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練琴獎勵系統</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <!-- 左側歡迎區 -->
        <div class="welcome-section">
            <img src="/icon.png" class="app-icon" alt="練琴獎勵系統">
            <h1>練琴<span>獎勵</span>系統</h1>
            <p>記錄每日練琴時間<br>交換遊戲時間獎勵</p>
        </div>

        <!-- 右側身份選擇 -->
        <div class="role-section">
            <h2>請選擇身份</h2>
            <p>選擇您的身份以開始使用</p>

            <a href="/parent.html" class="role-btn parent-btn">
                <span class="role-icon">👨‍👩‍👧</span>
                <div class="role-text-block">
                    <span class="role-label">家長</span>
                    <span class="role-desc">管理孩子帳號、審核練琴記錄、給予獎勵</span>
                </div>
            </a>

            <a href="/child.html" class="role-btn child-btn">
                <span class="role-icon">👧</span>
                <div class="role-text-block">
                    <span class="role-label">孩子</span>
                    <span class="role-desc">登錄練琴時間、查看獎勵點數、兌換獎勵</span>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
